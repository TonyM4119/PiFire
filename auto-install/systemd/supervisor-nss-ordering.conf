# PiFire drop-in for the supervisor systemd unit, installed as
# /etc/systemd/system/<unit>.service.d/pifire-nss-ordering.conf by
# pifire_install_supervisor_ordering (auto-install/pifire-install-common.sh).
#
# control and webapp run as the install user. When that account comes from a
# directory service (sssd), supervisord can be started before the name service
# answers, fails with "Invalid user name <user>", and nothing retries -- the
# grill is left unsupervised until someone starts it by hand. Start only once
# user lookups are available. After= and Wants= are no-ops on hosts without
# sssd, so the same file is correct everywhere; Requires=/BindsTo= would not be.
[Unit]
After=sssd.service sssd-nss.socket nss-user-lookup.target
Wants=nss-user-lookup.target

[Service]
# A lookup that still fails transiently must self-heal rather than stay down.
Restart=on-failure
RestartSec=5
