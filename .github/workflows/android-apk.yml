# Builds the PiFire mobile app for Android and publishes the .apk as a
# GitHub Release, so it can be downloaded straight onto a phone.
# No Expo account needed: the native project is generated with
# `expo prebuild` and compiled with Gradle on GitHub's runner.
name: Build Android app

on:
  push:
    branches: ["massive-reworks-and-new-ui"]
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: "1"
        run: |
          set -o pipefail
          bunx expo prebuild --platform android --no-install --clean 2>&1 | tee ../build.log

      - name: Compile release APK
        working-directory: mobile/android
        env:
          CI: "1"
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../../build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="PiFire-${GITHUB_RUN_NUMBER}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "android-${GITHUB_RUN_NUMBER}" "$apk" \
            --target "$GITHUB_SHA" --latest \
            --title "PiFire Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone, tap the .apk, and allow installing from this source when asked."

      # Issues are off on this repo, so a failed build leaves its log on a
      # pre-release instead, where it can be read without Actions access.
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 400 build.log > "build-failure-${GITHUB_RUN_NUMBER}.log" || echo "no log" > "build-failure-${GITHUB_RUN_NUMBER}.log"
          gh release create "android-failed-${GITHUB_RUN_NUMBER}" "build-failure-${GITHUB_RUN_NUMBER}.log" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android build ${GITHUB_RUN_NUMBER} FAILED" \
            --notes "Build log attached. Safe to delete once fixed."
